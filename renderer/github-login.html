<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' https://github.com https://api.github.com; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src https://github.com https://api.github.com">
  <title>GitHub 登录</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
      background: #0e1116; color: #e6e6e6;
      padding: 28px 24px; font-size: 14px; line-height: 1.6;
      user-select: none;
    }
    h1 { font-size: 16px; margin-bottom: 4px; }
    .sub { color: #8b949e; font-size: 12px; margin-bottom: 20px; }
    .card {
      border: 1px solid #30363d; border-radius: 10px;
      background: #161b22; padding: 16px; margin-bottom: 14px;
    }
    .row { display: flex; align-items: center; gap: 10px; }
    .code {
      font-family: ui-monospace, Consolas, monospace; font-size: 22px;
      letter-spacing: 3px; color: #58a6ff; font-weight: 700;
      margin: 10px 0; user-select: text;
    }
    button {
      font: inherit; color: #e6e6e6; background: #21262d;
      border: 1px solid #30363d; border-radius: 8px;
      padding: 8px 16px; cursor: pointer;
    }
    button:hover { border-color: #58a6ff; }
    button:disabled { opacity: .5; cursor: default; }
    button.primary { background: #238636; border-color: #2ea043; color: #fff; }
    button.primary:hover { border-color: #3fb950; }
    .muted { color: #8b949e; font-size: 12px; }
    .err { color: #f85149; font-size: 12px; margin-top: 8px; }
    .hidden { display: none; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
    .dot-ok { background: #3fb950; }
    .dot-off { background: #6e7681; }
  </style>
</head>
<body>
  <h1>GitHub 登录</h1>
  <p class="sub">可视化登录，全程无需终端。令牌保存在 <span class="muted">~/.dsh/github-auth.json</span>，并同步给 gh CLI。</p>

  <div class="card" id="status-card">
    <div class="row">
      <span class="status-dot dot-off" id="status-dot"></span>
      <span id="status-text">正在检查登录状态…</span>
    </div>
    <div style="margin-top:10px">
      <button id="login-btn" class="primary hidden">登录 GitHub</button>
      <button id="logout-btn" class="hidden">退出登录</button>
    </div>
  </div>

  <div class="card hidden" id="flow-card">
    <div>请在浏览器中完成授权：</div>
    <div class="code" id="user-code">----</div>
    <div class="row">
      <button id="open-browser" class="primary">打开浏览器授权</button>
      <span class="muted" id="flow-hint">等待授权中…</span>
    </div>
    <div class="err hidden" id="flow-err"></div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    const dsh = window.dshDesktop;

    // 设备码流程完全在本窗口内执行：与用户浏览器共用同一网络栈（Chromium），
    // 浏览器能打开 GitHub，这里就能完成轮询——不依赖主进程的网络通道。
    const CLIENT_ID = '178c6fc778ccc68e1d6a'; // GitHub CLI 的 OAuth client_id
    const SCOPES = 'repo workflow gist read:org';
    const DEVICE_CODE_URL = 'https://github.com/login/device/code';
    const ACCESS_TOKEN_URL = 'https://github.com/login/oauth/access_token';
    const USER_URL = 'https://api.github.com/user';

    let pollTimer = null;
    let pollInterval = 3000;
    let attempts = 0;

    function stopPolling() { if (pollTimer) { clearTimeout(pollTimer); clearInterval(pollTimer); pollTimer = null; } }

    async function postForm(url, body) {
      const res = await fetch(url, {
        method: 'POST',
        headers: {
          'content-type': 'application/x-www-form-urlencoded',
          accept: 'application/json',
        },
        body,
        signal: AbortSignal.timeout(20000),
      });
      let data = null;
      try { data = await res.json(); } catch {}
      if (!res.ok) {
        throw new Error((data && (data.error_description || data.message)) || ('GitHub HTTP ' + res.status));
      }
      return data;
    }

    async function refreshStatus() {
      try {
        const s = await dsh.githubStatus();
        $('status-dot').className = 'status-dot ' + (s.loggedIn ? 'dot-ok' : 'dot-off');
        $('status-text').textContent = s.loggedIn
          ? ('已登录：' + s.login + '（权限：' + (s.scopes.join(', ') || '无') + '）')
          : '未登录';
        $('login-btn').classList.toggle('hidden', s.loggedIn);
        $('logout-btn').classList.toggle('hidden', !s.loggedIn);
      } catch (e) {
        $('status-text').textContent = '状态读取失败：' + e.message;
      }
    }

    async function pollOnce(deviceCode) {
      attempts += 1;
      let data;
      try {
        data = await postForm(ACCESS_TOKEN_URL,
          'client_id=' + CLIENT_ID +
          '&device_code=' + encodeURIComponent(deviceCode) +
          '&grant_type=' + encodeURIComponent('urn:ietf:params:oauth:grant-type:device_code'));
      } catch (e) {
        $('flow-hint').textContent = '网络抖动，继续等待授权中…（第 ' + attempts + ' 次）';
        return 'retry';
      }
      if (typeof data.access_token === 'string' && data.access_token) {
        stopPolling();
        $('flow-card').classList.add('hidden');
        const token = data.access_token;
        const scopes = String(data.scope || '').split(',').map((s) => s.trim()).filter(Boolean);
        let login = null;
        try {
          const userRes = await fetch(USER_URL, {
            headers: { authorization: 'Bearer ' + token },
            signal: AbortSignal.timeout(15000),
          });
          if (userRes.ok) {
            const user = await userRes.json();
            if (user && typeof user.login === 'string') login = user.login;
          }
        } catch {}
        const save = await dsh.githubSave({ token, login, scopes });
        if (save && save.ok) {
          $('status-dot').className = 'status-dot dot-ok';
          $('status-text').textContent = '登录成功：' + (login || save.login || 'unknown')
            + (login ? '' : '（授权已生效；用户名暂时显示 unknown）');
          $('login-btn').classList.add('hidden');
          $('logout-btn').classList.remove('hidden');
        } else {
          $('flow-err').textContent = '令牌保存失败：' + ((save && save.error) || '未知错误');
          $('flow-err').classList.remove('hidden');
        }
        return 'done';
      }
      if (data.error === 'authorization_pending') {
        $('flow-hint').textContent = '等待授权中…（第 ' + attempts + ' 次）';
        return 'retry';
      }
      if (data.error === 'slow_down') {
        pollInterval += 5000;
        $('flow-hint').textContent = 'GitHub 要求放慢轮询，继续等待…';
        return 'retry';
      }
      if (data.error === 'expired_token' || data.error === 'access_denied') {
        stopPolling();
        $('flow-hint').textContent = '登录失败';
        $('flow-err').textContent = data.error === 'expired_token' ? '验证码已过期，请重新发起登录' : '授权被拒绝';
        $('flow-err').classList.remove('hidden');
        $('open-browser').disabled = false;
        return 'stop';
      }
      $('flow-hint').textContent = '授权状态未知：' + (data.error || '未知') + '（继续等待）';
      return 'retry';
    }

    function startPolling(deviceCode) {
      stopPolling();
      const tick = async () => {
        if (!pollTimer) return;
        const state = await pollOnce(deviceCode);
        if (pollTimer && (state === 'retry')) pollTimer = setTimeout(tick, pollInterval);
      };
      pollTimer = setTimeout(tick, pollInterval);
    }

    $('login-btn').addEventListener('click', async () => {
      $('flow-err').classList.add('hidden');
      attempts = 0;
      pollInterval = 3000;
      try {
        const data = await postForm(DEVICE_CODE_URL,
          'client_id=' + CLIENT_ID + '&scope=' + encodeURIComponent(SCOPES));
        if (typeof data.device_code !== 'string' || typeof data.user_code !== 'string') {
          throw new Error('GitHub 设备码响应格式异常');
        }
        $('user-code').textContent = data.user_code;
        $('open-browser').disabled = false;
        $('flow-hint').textContent = '等待授权中…';
        $('flow-card').classList.remove('hidden');
        startPolling(data.device_code);
      } catch (e) {
        $('flow-err').textContent = '发起登录失败：' + e.message;
        $('flow-err').classList.remove('hidden');
      }
    });

    $('open-browser').addEventListener('click', async () => {
      const code = $('user-code').textContent;
      await dsh.githubOpenBrowser('https://github.com/login/device');
      try { navigator.clipboard.writeText(code); } catch {}
      $('flow-hint').textContent = '已在浏览器打开授权页，请输入：' + code + '（已复制到剪贴板）';
      $('open-browser').disabled = true;
    });

    $('logout-btn').addEventListener('click', async () => {
      await dsh.githubLogout();
      await refreshStatus();
    });

    refreshStatus();
  </script>
</body>
</html>
